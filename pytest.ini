[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -m "not network"
filterwarnings =
    # 本机 requests/urllib3 组合的环境性提示，与代码无关
    ignore::requests.exceptions.RequestsDependencyWarning
markers =
    network: 会向真实主机（如 api.openai.com）发请求的集成冒烟测试。默认不跑，用 pytest -m network 显式运行。
