# GitHub Secret Scanner Pro - configuration file
# Externalized configuration, so parameters are easy to adjust

# ============================================================================
#                          Scanner settings
# ============================================================================
scanner:
  # Entropy threshold (keys below this are treated as test data)
  entropy_threshold: 3.8

  # Maximum file size (KB)
  max_file_size_kb: 500

  # Async download concurrency
  async_download_concurrency: 60

  # Context window (N lines before and after)
  context_window: 10

# ============================================================================
#                          Validator settings
# ============================================================================
validator:
  # Maximum concurrency
  max_concurrency: 100

  # Request timeout (seconds)
  request_timeout: 15

  # Worker thread count
  num_workers: 2

# ============================================================================
#                          Database settings
# ============================================================================
database:
  # Database path
  db_path: "leaked_keys.db"

  # Batch write size
  batch_size: 50

  # Flush interval (seconds)
  flush_interval: 5.0

# ============================================================================
#                          Circuit breaker settings
# ============================================================================
circuit_breaker:
  # Whether enabled
  enabled: true

  # Consecutive-failure threshold
  failure_threshold: 5

  # Circuit-breaker recovery time (seconds)
  recovery_timeout: 60

  # Probe requests allowed while half-open
  half_open_requests: 3

# ============================================================================
#                          Domain blacklist
# ============================================================================
blacklist:
  domains:
    - localhost
    - 127.0.0.1
    - 0.0.0.0
    - example.com
    - test.com
    - my-api
    - your-api
    - xxx
    - placeholder
    - fake
    - dummy
    - sample
    - mock
    - staging.
    - sandbox.
    - dev.
    - demo.
    - test.
    - .local
    - .internal
    - ngrok.io
    - localtunnel

  paths:
    - /test/
    - /tests/
    - /__tests__/
    - /spec/
    - /specs/
    - /mock/
    - /mocks/
    - /__mocks__/
    - /fixture/
    - /fixtures/
    - /example/
    - /examples/
    - /sample/
    - /samples/
    - /demo/
    - /demos/
    - /doc/
    - /docs/
    - /vendor/
    - /node_modules/
    - /venv/
    - /.venv/
    - /dist/
    - /build/
    - /out/
    - /coverage/
    - /.github/ISSUE_TEMPLATE/
    - /sandbox/
    - /playground/
    - /staging/
    - /tutorial/
    - /tutorials/
    - /workshop/
    - /workshops/
    - /boilerplate/
    - /starter/

# ============================================================================
#                          File extension filtering
# ============================================================================
file_filter:
  # Allowed extensions
  allowed_extensions:
    - .py
    - .js
    - .ts
    - .jsx
    - .tsx
    - .env
    - .env.local
    - .env.production
    - .env.development
    - .yml
    - .yaml
    - .toml
    - .sh
    - .bash
    - .zsh
    - .php
    - .rb
    - .go
    - .rs
    - .java
    - .conf
    - .cfg
    - .ini
    - .dockerfile

  # Extensions that must be blocked
  blocked_extensions:
    - .lock
    - .min.js
    - .min.css
    - .map
    - .md
    - .rst
    - .txt
    - .html
    - .htm
    - .css
    - .scss
    - .less
    - .svg
    - .png
    - .jpg
    - .jpeg
    - .gif
    - .ico
    - .woff
    - .woff2
    - .ttf
    - .eot
    - .pdf
    - .doc
    - .docx
    - .xls
    - .xlsx
    - .zip
    - .tar
    - .gz
    - .rar
    - .exe
    - .dll
    - .so
    - .dylib
    - .pyc
    - .pyo
    - .class
    - .ipynb
    - .csv

# ============================================================================
#                          Performance monitoring
# ============================================================================
monitoring:
  # Whether Prometheus metrics are enabled
  enable_prometheus: false

  # Prometheus port
  prometheus_port: 8000

  # Stats output interval (seconds)
  stats_interval: 60

# ============================================================================
#                          Logging settings
# ============================================================================
logging:
  # Log level (DEBUG/INFO/WARNING/ERROR)
  level: INFO

  # Whether to log to a file
  log_to_file: false

  # Log file path
  log_file: "scanner.log"
