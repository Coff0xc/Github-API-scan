# GitHub Secret Scanner Pro - notification config file
# ==========================================
#
# Usage:
# 1. Copy this file to notify_config.yaml
# 2. Fill in your Webhook/Token details
# 3. Set enabled to true to enable a channel
#
# Supported notification channels:
# - Discord: free, unlimited, rich-text Embed support
# - Slack: free, unlimited, Block Kit support
# - Telegram: free, unlimited, Markdown support
# - Feishu: free, card-message support
# - DingTalk: free, signed-request security support
# - ServerChan: WeChat push
# - Bark: iOS push
# - File: local logging
# - Sound: system alert sounds

# ============================================================================
#                              Discord settings
# ============================================================================
# How to get one: Server Settings -> Integrations -> Webhooks -> New Webhook
discord:
  enabled: false
  webhook_url: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
  # Minimum notification level: critical, high, medium, low
  min_severity: medium

# ============================================================================
#                              Slack settings
# ============================================================================
# How to get one: https://api.slack.com/apps -> Create App -> Incoming Webhooks
slack:
  enabled: false
  webhook_url: "https://hooks.slack.com/services/YOUR_TEAM_ID/YOUR_HOOK_ID/YOUR_WEBHOOK_TOKEN"
  min_severity: medium

# ============================================================================
#                              Telegram settings
# ============================================================================
# How to get one:
# 1. Chat with @BotFather, send /newbot to create a bot and get its token
# 2. Chat with the bot, then visit https://api.telegram.org/bot<TOKEN>/getUpdates to get the chat_id
telegram:
  enabled: false
  bot_token: "123456789:ABCdefGHIjklMNOpqrsTUVwxyz"
  chat_id: "123456789"
  min_severity: medium

# ============================================================================
#                              Feishu settings
# ============================================================================
# How to get one: Feishu group settings -> Group bots -> Add bot -> Custom bot
feishu:
  enabled: false
  webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
  min_severity: medium

# ============================================================================
#                              DingTalk settings
# ============================================================================
# How to get one: DingTalk group settings -> Smart group assistant -> Add bot -> Custom
# Enabling signed-request security verification is recommended
dingtalk:
  enabled: false
  webhook_url: "https://oapi.dingtalk.com/robot/send?access_token=xxxxxx"
  secret: ""  # Signing secret (optional, recommended)
  min_severity: medium

# ============================================================================
#                              ServerChan settings (WeChat push)
# ============================================================================
# How to get one: register at https://sct.ftqq.com/ to get a SendKey
serverchan:
  enabled: false
  send_key: "SCTxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  min_severity: high  # Only important notifications are recommended

# ============================================================================
#                              Bark settings (iOS push)
# ============================================================================
# How to get one: download the Bark app from the App Store to get a device key
bark:
  enabled: false
  server_url: "https://api.day.app"  # or your self-hosted server address
  device_key: "YOUR_DEVICE_KEY"
  min_severity: high

# ============================================================================
#                              PushPlus settings (QQ/WeChat)
# ============================================================================
# How to get one: register at https://www.pushplus.plus/ to get a token
pushplus:
  enabled: false
  token: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  min_severity: medium

# ============================================================================
#                              WxPusher settings (WeChat)
# ============================================================================
# How to get one: register at https://wxpusher.zjiecode.com/ to get an appToken and UID
wxpusher:
  enabled: false
  app_token: "AT_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  uid: "UID_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  min_severity: medium

# ============================================================================
#                              Email settings
# ============================================================================
email:
  enabled: false
  smtp_server: "smtp.qq.com"
  smtp_port: 465
  use_ssl: true
  username: "your_email@qq.com"
  password: "your_smtp_password"  # QQ Mail requires an authorization code
  from_addr: "your_email@qq.com"
  to_addrs:
    - "your_email@qq.com"
  min_severity: high

# ============================================================================
#                              File logging
# ============================================================================
file:
  enabled: true
  output_path: "~/Desktop/found_keys.txt"
  # An absolute path also works
  # output_path: "C:/Users/YourName/Desktop/found_keys.txt"

# ============================================================================
#                              Sound alerts
# ============================================================================
sound:
  enabled: true
  # Critical: urgent alert sound (3 times)
  # High: double beep
  # Medium/Low: single beep

# ============================================================================
#                              Quiet hours
# ============================================================================
# No notifications during this period (except Critical)
quiet_hours:
  enabled: false
  start: "23:00"  # Start time (24-hour clock)
  end: "07:00"    # End time

# ============================================================================
#                              Rate limiting
# ============================================================================
rate_limit:
  enabled: true
  window: 60      # Time window (seconds)
  max_count: 30   # Max notifications per window
  # Critical notifications are not rate-limited

# ============================================================================
#                              Daily report
# ============================================================================
daily_report:
  enabled: false
  time: "20:00"   # Send time (24-hour clock)
  # The report goes to all enabled channels

# ============================================================================
#                              Advanced settings
# ============================================================================
advanced:
  # Notification deduplication (avoid notifying the same key twice)
  deduplication: true

  # Special handling for high-value keys
  high_value_alert: true

  # Log level: DEBUG, INFO, WARNING, ERROR
  log_level: INFO
