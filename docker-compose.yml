version: '3.8'

services:
  scanner:
    build: .
    container_name: api-key-scanner
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./config_local.py:/app/config_local.py:ro
    environment:
      - GITHUB_TOKENS=${GITHUB_TOKENS}
      - PROXY_URL=${PROXY_URL:-}
      - DB_PATH=/app/data/leaked_keys.db
      - DB_ENCRYPTION_KEY=${DB_ENCRYPTION_KEY:-}
      - SCANNER_AUTHORIZED=${SCANNER_AUTHORIZED:-}
    restart: unless-stopped
    # For a remote scan you must also add --target-org or --target-repo, and set DB_ENCRYPTION_KEY.
    # No default scope is given here, so the container does not start searching all of GitHub on launch.
    command: python main_v2.2.py

  dashboard:
    build: .
    container_name: api-key-dashboard
    ports:
      # For LAN access change this to "5000:5000", and be sure to set a strong DASHBOARD_TOKEN in .env
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - DB_PATH=/app/data/leaked_keys.db
      - DASHBOARD_TOKEN=${DASHBOARD_TOKEN:-}
      - DASHBOARD_HOST=0.0.0.0
      - EXPORT_KEY=${EXPORT_KEY:-}
      - DB_ENCRYPTION_KEY=${DB_ENCRYPTION_KEY:-}
    restart: unless-stopped
    command: python web_dashboard.py
    depends_on:
      - scanner

networks:
  default:
    name: api-scanner-network
