version: '3.8'

services:
  scanner:
    build: .
    container_name: api-key-scanner
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./config_local.py:/app/config_local.py:ro
    environment:
      - GITHUB_TOKENS=${GITHUB_TOKENS}
      - PROXY_URL=${PROXY_URL:-}
      - DB_PATH=/app/data/leaked_keys.db
      - DB_ENCRYPTION_KEY=${DB_ENCRYPTION_KEY:-}
      - SCANNER_AUTHORIZED=${SCANNER_AUTHORIZED:-}
    restart: unless-stopped
    # 远程扫描还要自行加上 --target-org 或 --target-repo，并设置 DB_ENCRYPTION_KEY。
    # 这里不给默认范围，避免容器一启动就搜索整个 GitHub。
    command: python main_v2.2.py

  dashboard:
    build: .
    container_name: api-key-dashboard
    ports:
      # 如需局域网访问改为 "5000:5000"，并务必在 .env 设置强 DASHBOARD_TOKEN
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - DB_PATH=/app/data/leaked_keys.db
      - DASHBOARD_TOKEN=${DASHBOARD_TOKEN:-}
      - DASHBOARD_HOST=0.0.0.0
      - EXPORT_KEY=${EXPORT_KEY:-}
      - DB_ENCRYPTION_KEY=${DB_ENCRYPTION_KEY:-}
    restart: unless-stopped
    command: python web_dashboard.py
    depends_on:
      - scanner

networks:
  default:
    name: api-scanner-network
